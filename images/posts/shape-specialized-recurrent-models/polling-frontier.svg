<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Periodic polling misses brief events unless it is expensive (analytic estimate) — evidence-triggered measurements pending</title>
  <desc id="d">Probability that periodic polling samples an event at least once, versus model calls per hour on a log axis, for a 1 second gesture and a 3 second event, assuming uniform phase. At one call a minute the probabilities are about 1.7 and 5 percent. Polling every 2 seconds catches half of 1 second gestures. A shaded band from 1 to 30 calls per hour marks where evidence-triggered measurements will go; it is empty because the experiment has not run.</desc>
  <rect width="720" height="400" fill="#fcfcfb"/>
  <!-- grid -->
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="80" y1="250" x2="680" y2="250"/>
    <line x1="80" y1="180" x2="680" y2="180"/>
    <line x1="80" y1="110" x2="680" y2="110"/>
    <line x1="80" y1="40" x2="680" y2="40"/>
  </g>
  <!-- PENDING band: 1 to 30 calls per hour -->
  <rect x="80" y="40" width="221.6" height="280" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="92" y="64" font-size="13" font-weight="600" fill="#0b0b0b">Evidence-triggered</text>
  <text x="92" y="82" font-size="13" fill="#0b0b0b">PENDING (§6.1)</text>
  <text x="92" y="100" font-size="12" fill="#52514e">measured recall and delay</text>
  <text x="92" y="116" font-size="12" fill="#52514e">go here, at 1–30 calls/hour</text>
  <line x1="80" y1="320" x2="680" y2="320" stroke="#8a8984" stroke-width="1"/>
  <!-- reference verticals -->
  <g stroke="#8a8984" stroke-width="1" stroke-dasharray="2 3">
    <line x1="346.7" y1="40" x2="346.7" y2="320"/>
    <line x1="568.3" y1="40" x2="568.3" y2="320"/>
  </g>
  <g font-size="11.5" fill="#52514e">
    <text x="351" y="62">once a minute</text>
    <text x="572" y="300">every 2 s</text>
  </g>
  <!-- series: 3 s event (orange) and 1 s gesture (blue) -->
  <polyline fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"
    points="80,319.8 230,317.7 380,296.7 425.2,273.3 451.6,250 484.9,203.3 496.7,180 515.5,133.3 530,86.7 541.9,40 680,40"/>
  <polyline fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"
    points="80,319.9 230,319.2 301.6,317.7 380,312.2 425.2,304.4 451.6,296.7 484.9,281.1 496.7,273.3 530,242.2 568.3,180 575.2,164.4 587,133.3 594.7,110 601.6,86.7 613.4,40 680,40"/>
  <!-- direct labels -->
  <text x="430" y="196" font-size="12.5" fill="#0b0b0b">3 s event</text>
  <text x="604" y="200" font-size="12.5" fill="#0b0b0b">1 s gesture</text>
  <!-- axes labels -->
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="72" y="324">0</text>
    <text x="72" y="254">0.25</text>
    <text x="72" y="184">0.5</text>
    <text x="72" y="114">0.75</text>
    <text x="72" y="44">1</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="80" y="340">1</text>
    <text x="230" y="340">10</text>
    <text x="380" y="340">100</text>
    <text x="530" y="340">1,000</text>
    <text x="680" y="340">10,000</text>
  </g>
  <text x="380" y="362" font-size="12.5" fill="#0b0b0b" text-anchor="middle">Decision-model calls per hour (log scale)</text>
  <text x="22" y="180" font-size="12.5" fill="#0b0b0b" text-anchor="middle" transform="rotate(-90 22 180)">P(event sampled at least once)</text>
  <!-- legend -->
  <g font-size="12" fill="#0b0b0b">
    <line x1="456" y1="386" x2="476" y2="386" stroke="#2a78d6" stroke-width="2"/>
    <text x="482" y="390">1 s gesture</text>
    <line x1="566" y1="386" x2="586" y2="386" stroke="#eb6834" stroke-width="2"/>
    <text x="592" y="390">3 s event</text>
  </g>
  <text x="80" y="390" font-size="11" fill="#52514e">E: min(1, duration × calls/hour ÷ 3600), uniform phase.</text>
</svg>
